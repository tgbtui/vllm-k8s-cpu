# Apple Silicon (M4, 16 GB) under Docker Desktop + Minikube: smaller footprint, float32.
# Deploy:  kubectl apply -k k8s/overlays/macos-m4
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: configmap-patch.yaml
  - path: deployment-patch.yaml
